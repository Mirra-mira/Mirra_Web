<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mirra</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><script>
      (function () {
        var lang = "vi";
        try {
          var stored = localStorage.getItem("mirra.lang");
          if (stored === "en" || stored === "vi") lang = stored;
        } catch (_e) {}
        window.location.replace("/" + lang + "/");
      })();
    </script><meta http-equiv="refresh" content="0; url=/vi/"></head><body></body></html>
